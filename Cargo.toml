[package]
name = "boxing_gym_backend"
version = "0.1.0"
edition = "2021"
description = "Backend system for a boxing gym with member management, course management, and booking system"

[dependencies]
# Web framework
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.42", features = ["full"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
thiserror = "1"
validator = { version = "0.18", features = ["derive"] }
time = "0.3.36"

[dev-dependencies]
actix-rt = "2"
actix-http = "3"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
